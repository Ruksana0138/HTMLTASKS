<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

/* Mobile First Layout */

.gallery{
  display:grid;
  grid-template-columns: repeat(2,1fr);
  gap:20px;
}

/* Card Style */

.card{
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  display:flex;
  flex-direction:column;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.desc{
  padding:10px;
  text-align:center;
  font-size:14px;
  color:#333;
}

/* Desktop Layout */

@media (min-width:768px){
  .gallery{
    grid-template-columns: repeat(3,1fr);
  }
}

</style>
</head>

<body>

<h2>Photo Gallery</h2>

<div class="gallery">

<div class="card">
<img src="https://picsum.photos/400/300?1" alt="">
<div class="desc">Beautiful Nature View</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?2" alt="">
<div class="desc">Mountain Landscape</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?3" alt="">
<div class="desc">City at Night</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?4" alt="">
<div class="desc">Ocean Waves</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?5" alt="">
<div class="desc">Sunset Photography</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?6" alt="">
<div class="desc">Green Forest</div>
</div>

</div>

</body>
</html>
