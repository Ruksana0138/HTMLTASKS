<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic-Tac-Toe</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
      margin-top: 50px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .status {
      margin: 10px 0;
      font-size: 18px;
      font-weight: bold;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 10px;
      justify-content: center;
      margin: 20px auto;
    }

    .cell {
      width: 100px;
      height: 100px;
      background: white;
      border-radius: 8px;
      font-size: 40px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: 0.2s;
    }

    .cell:hover {
      background: #eee;
    }

    .cell.disabled {
      pointer-events: none;
      background: #ddd;
    }

    .restart-btn {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background: purple;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .restart-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

<h1>Tic-Tac-Toe</h1>

<div class="status" id="status">Player X Turn</div>

<div class="board" id="board"></div>

<button class="restart-btn" onclick="restartGame()">Restart Game</button>

<script>

let board = ["", "", "", "", "", "", "", "", ""];
let currentPlayer = "X";
let gameActive = true;


const winningPatterns = [
  [0,1,2],
  [3,4,5],
  [6,7,8],
  [0,3,6],
  [1,4,7],
  [2,5,8],
  [0,4,8],
  [2,4,6]
];


function createBoard() {
  const boardElement = document.getElementById("board");
  boardElement.innerHTML = "";

  board.forEach((cell, index) => {
    const div = document.createElement("div");
    div.classList.add("cell");
    div.innerText = cell;
    div.addEventListener("click", () => handleClick(index));

    boardElement.appendChild(div);
  });
}


function handleClick(index) {
  if (board[index] !== "" || !gameActive) return;

  board[index] = currentPlayer;
  createBoard();
  checkResult();
}


function checkResult() {
  let winner = null;

  for (let pattern of winningPatterns) {
    const [a, b, c] = pattern;

    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      winner = board[a];
      break;
    }
  }

  if (winner) {
    document.getElementById("status").innerText = `Player ${winner} Wins! 🎉`;
    gameActive = false;
    return;
  }

  if (!board.includes("")) {
    document.getElementById("status").innerText = "It's a Draw 🤝";
    gameActive = false;
    return;
  }

  currentPlayer = currentPlayer === "X" ? "O" : "X";
  document.getElementById("status").innerText = `Player ${currentPlayer}'s Turn`;
}


function restartGame() {
  board = ["", "", "", "", "", "", "", "", ""];
  currentPlayer = "X";
  gameActive = true;
  document.getElementById("status").innerText = "Player X's Turn";
  createBoard();
}


createBoard();

</script>

</body>
</html>
