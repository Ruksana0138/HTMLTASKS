<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .calculator {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .display {
      width: 100%;
      height: 60px;
      background: #000;
      color: #0f0;
      font-size: 24px;
      text-align: right;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .number {
      background: #444;
      color: white;
    }

    .operator {
      background: orange;
      color: white;
    }

    .equal {
      background: green;
      color: white;
      grid-column: span 2;
    }

    .clear {
      background: red;
      color: white;
    }

    .delete {
      background: #555;
      color: white;
    }
  </style>
</head>

<body>

<div class="calculator">
  <div id="display" class="display">0</div>

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="delete" onclick="deleteLast()">⌫</button>
    <button class="operator" onclick="appendValue('%')">%</button>
    <button class="operator" onclick="appendValue('/')">÷</button>

    <button class="number" onclick="appendValue('7')">7</button>
    <button class="number" onclick="appendValue('8')">8</button>
    <button class="number" onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('*')">×</button>

    <button class="number" onclick="appendValue('4')">4</button>
    <button class="number" onclick="appendValue('5')">5</button>
    <button class="number" onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('-')">−</button>

    <button class="number" onclick="appendValue('1')">1</button>
    <button class="number" onclick="appendValue('2')">2</button>
    <button class="number" onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button class="number" onclick="appendValue('0')">0</button>
    <button class="number" onclick="appendValue('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>

let display = document.getElementById("display");

/* Append value */
function appendValue(value) {
  if (display.innerText === "0") {
    display.innerText = value;
  } else {
    display.innerText += value;
  }
}

/* Clear */
function clearDisplay() {
  display.innerText = "0";
}

/* Delete */
function deleteLast() {
  let current = display.innerText;

  if (current.length === 1) {
    display.innerText = "0";
  } else {
    display.innerText = current.slice(0, -1);
  }
}

/* REAL calculator percentage logic */
function handlePercentage(expression) {
  return expression.replace(
    /(\d+(\.\d+)?)([+\-*/])(\d+(\.\d+)?)%/g,
    (match, num1, _, operator, num2) => {
      num1 = parseFloat(num1);
      num2 = parseFloat(num2);

      let percentValue;

      if (operator === '+' || operator === '-') {
        percentValue = (num1 * num2) / 100;
      } else {
        percentValue = num2 / 100;
      }

      return `${num1}${operator}${percentValue}`;
    }
  );
}

/* Calculate */
function calculate() {
  try {
    let expression = display.innerText;

    expression = expression
      .replace(/×/g, '*')
      .replace(/÷/g, '/');

    expression = handlePercentage(expression);

    let result = eval(expression);

    display.innerText = result;
  } catch {
    display.innerText = "Error";
  }
}

</script>

</body>
</html>
